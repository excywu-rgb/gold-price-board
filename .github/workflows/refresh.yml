name: 金价数据每小时刷新

on:
  # 每小时刷新由本机 launchd 负责；这里只保留故障恢复用的手动触发，
  # 避免 Actions 与本机在同一分钟写同一份历史数据。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 DD373 金价
        run: python3 scripts/fetch_gold.py --out docs/data/gold_history.json

      - name: 生成看板 HTML
        run: python3 scripts/generate_html.py docs/data/gold_history.json docs/index.html

      - name: 提交并推送更新
        run: python3 scripts/commit_state.py
