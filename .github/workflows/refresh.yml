name: 金价数据每小时刷新
run-name: 金价刷新 · ${{ inputs.triggered_by || 'manual' }}

on:
  # 由 Cloudflare Cron 通过 API 触发；不使用 GitHub 原生 schedule。
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "触发来源"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: gold-price-production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 快进到远端最新正式数据
        run: git pull --ff-only origin main

      - name: 抓取 DD373 金价
        run: python3 scripts/fetch_gold.py --out docs/data/gold_history.json

      - name: 生成看板 HTML
        run: python3 scripts/generate_html.py docs/data/gold_history.json docs/index.html

      - name: 提交并推送更新
        run: python3 scripts/commit_state.py
